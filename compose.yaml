# Local development stack. Not a production configuration: see docs/DEPLOYMENT.md.
# Create the database password first: see README.md "Run locally".
name: baluarte

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-app-env: &app-env
  BALUARTE_DATABASE_URL: postgresql://baluarte@db:5432/baluarte
  BALUARTE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  # JSON lines (default) or text; secrets are redacted in both.
  BALUARTE_LOG_LEVEL: ${BALUARTE_LOG_LEVEL:-INFO}
  BALUARTE_LOG_FORMAT: ${BALUARTE_LOG_FORMAT:-json}

x-database: &database
  environment: *app-env
  secrets: [postgres_password]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baluarte
      POSTGRES_USER: baluarte
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baluarte -d baluarte"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. Safe to re-run.
  migrate:
    <<: [*hardening, *database]
    build: ./backend
    image: baluarte-app:dev
    command: ["baluarte-migrate", "--timeout", "60"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*hardening, *database]
    image: baluarte-app:dev
    environment:
      <<: *app-env
      # OIDC sign-in, read from the shell or a .env file. Until it is configured, sign-in and
      # every protected endpoint answer 503. See backend/README.md.
      BALUARTE_PUBLIC_URL: ${BALUARTE_PUBLIC_URL:-}
      BALUARTE_OIDC_ISSUER: ${BALUARTE_OIDC_ISSUER:-}
      BALUARTE_OIDC_CLIENT_ID: ${BALUARTE_OIDC_CLIENT_ID:-}
      BALUARTE_OIDC_ROLES_CLAIM: ${BALUARTE_OIDC_ROLES_CLAIM:-}
      BALUARTE_OIDC_ADMIN_GROUPS: ${BALUARTE_OIDC_ADMIN_GROUPS:-}
      BALUARTE_OIDC_ANALYST_GROUPS: ${BALUARTE_OIDC_ANALYST_GROUPS:-}
      BALUARTE_OIDC_AUDITOR_GROUPS: ${BALUARTE_OIDC_AUDITOR_GROUPS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  # Background jobs: same image as the API, different command. SIGTERM finishes the current job.
  worker:
    <<: [*hardening, *database]
    image: baluarte-app:dev
    command: ["baluarte-worker"]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "baluarte-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    <<: *hardening
    build: ./frontend
    image: baluarte-web:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  db-data:
