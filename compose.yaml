# Local development stack. Not a production configuration: see docs/DEPLOYMENT.md.
# Create the database password and the secret key first: see README.md "Run locally".
name: baluarte

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-log-env: &log-env
  # JSON lines (default) or text; secrets are redacted in both.
  BALUARTE_LOG_LEVEL: ${BALUARTE_LOG_LEVEL:-INFO}
  BALUARTE_LOG_FORMAT: ${BALUARTE_LOG_FORMAT:-json}

# The API and worker connect as baluarte_app, which migrate creates. It reads and writes data
# but owns nothing, cannot change the schema and cannot alter audit events (docs/SECURITY.md).
x-app-env: &app-env
  <<: *log-env
  BALUARTE_DATABASE_URL: postgresql://baluarte_app@db:5432/baluarte
  BALUARTE_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
  # true lets one person turn two-person review off for development (docs/COMPLIANCE.md).
  BALUARTE_DEVELOPMENT_MODE: ${BALUARTE_DEVELOPMENT_MODE:-false}
  # true lets approved label plans be applied to GitLab with the write token entered in the
  # web UI (docs/LABELS.md). Off by default.
  BALUARTE_LABEL_WRITES: ${BALUARTE_LABEL_WRITES:-false}

x-database: &database
  environment: *app-env
  secrets: [app_database_password]

# Seals the GitLab token and OIDC client secret entered in the web UI (docs/SECURITY.md).
x-secret-key-env: &secret-key-env
  BALUARTE_SECRET_KEY_FILE: /run/secrets/secret_key

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baluarte
      POSTGRES_USER: baluarte
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baluarte -d baluarte"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. Safe to re-run.
  migrate:
    <<: *hardening
    build: ./backend
    image: baluarte-app:dev
    command: ["baluarte-migrate", "--timeout", "60"]
    # Runs as the schema owner, then sets up baluarte_app.
    environment:
      <<: *log-env
      BALUARTE_DATABASE_URL: postgresql://baluarte@db:5432/baluarte
      BALUARTE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      BALUARTE_APP_DATABASE_USER: baluarte_app
      BALUARTE_APP_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      BALUARTE_BACKUP_DATABASE_USER: baluarte_backup
      BALUARTE_BACKUP_DATABASE_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets: [postgres_password, app_database_password, backup_database_password]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*hardening, *database]
    image: baluarte-app:dev
    environment:
      <<: [*app-env, *secret-key-env]
      # OIDC sign-in, read from the shell or a .env file. Until it is configured, sign-in and
      # every protected endpoint answer 503. See backend/README.md.
      BALUARTE_PUBLIC_URL: ${BALUARTE_PUBLIC_URL:-}
      BALUARTE_OIDC_ISSUER: ${BALUARTE_OIDC_ISSUER:-}
      BALUARTE_OIDC_CLIENT_ID: ${BALUARTE_OIDC_CLIENT_ID:-}
      BALUARTE_OIDC_ROLES_CLAIM: ${BALUARTE_OIDC_ROLES_CLAIM:-}
      BALUARTE_OIDC_ADMIN_GROUPS: ${BALUARTE_OIDC_ADMIN_GROUPS:-}
      BALUARTE_OIDC_ANALYST_GROUPS: ${BALUARTE_OIDC_ANALYST_GROUPS:-}
      BALUARTE_OIDC_AUDITOR_GROUPS: ${BALUARTE_OIDC_AUDITOR_GROUPS:-}
    secrets: [app_database_password, secret_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  # Background jobs: same image as the API, different command. SIGTERM finishes the current job.
  worker:
    <<: [*hardening, *database]
    image: baluarte-app:dev
    command: ["baluarte-worker"]
    environment:
      <<: [*app-env, *secret-key-env]
    secrets: [app_database_password, secret_key]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "baluarte-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    <<: *hardening
    build: ./frontend
    image: baluarte-web:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # Encrypted database backups on a schedule; only with --profile backup (docs/OPERATIONS.md).
  # Set BALUARTE_BACKUP_RECIPIENT to your age public key; the private key stays offline.
  backup:
    <<: *hardening
    profiles: [backup]
    build: ./deploy/backup
    image: baluarte-backup:dev
    environment:
      PGHOST: db
      BALUARTE_BACKUP_DATABASE_USER: baluarte_backup
      BALUARTE_BACKUP_DATABASE_PASSWORD_FILE: /run/secrets/backup_database_password
      BALUARTE_BACKUP_RECIPIENT: ${BALUARTE_BACKUP_RECIPIENT:-}
      BALUARTE_BACKUP_INTERVAL_HOURS: ${BALUARTE_BACKUP_INTERVAL_HOURS:-24}
      BALUARTE_BACKUP_KEEP: ${BALUARTE_BACKUP_KEEP:-14}
    secrets: [backup_database_password]
    # Writable by uid 70. Mount storage that is copied off this host.
    volumes:
      - ${BALUARTE_BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "baluarte-backup", "health"]
      interval: 5m
      timeout: 10s
      start_period: 10m

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_database_password:
    file: ./secrets/app_database_password
  backup_database_password:
    file: ./secrets/backup_database_password
  secret_key:
    file: ./secrets/secret_key

volumes:
  db-data:
