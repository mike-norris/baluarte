[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baluarte"
version = "0.1.0.dev0"
description = "Self-hosted governance and audit-evidence platform for self-managed GitLab"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20",
  "fastapi>=0.162",
  "httpx>=0.28",
  "psycopg[binary]>=3.3",
  "pydantic>=2.14",
  "pyjwt[crypto]>=2.15",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.1",
  "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4",
  "pytest>=9.2",
  "ruff>=0.17",
  "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
baluarte-migrate = "baluarte.db.migrate:main"
baluarte-worker = "baluarte.jobs.worker:main"
baluarte-verify-export = "baluarte.evidence.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baluarte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: requires PostgreSQL (set BALUARTE_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Generated migrations keep long SQL literals on one line.
"src/baluarte/db/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["baluarte"]
mypy_path = "src"
