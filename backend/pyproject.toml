[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baluarte"
version = "0.1.0.dev0"
description = "Self-hosted governance and audit-evidence platform for self-managed GitLab"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=2.4",
  "pytest>=9.2",
  "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baluarte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["baluarte"]
mypy_path = "src"
