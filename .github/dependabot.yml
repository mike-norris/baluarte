version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dev:
        dependency-type: development
    ignore:
      # eslint-plugin-jsx-a11y 6.x only declares ESLint <= 9 as a peer, so
      # ESLint 10 fails `npm ci`. Remove once jsx-a11y supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
