name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  backend:
    name: Backend lint, typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: baluarte
          # Throwaway database in an ephemeral CI container, reachable only from this job.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baluarte"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BALUARTE_TEST_DATABASE_URL: postgresql://baluarte:ci-only-not-a-secret@127.0.0.1:5432/postgres
      BALUARTE_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  frontend:
    name: Frontend audit, lint, typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and render each CI values file
        run: |
          for values in deploy/helm/baluarte/ci/*-values.yaml; do
            echo "::group::$values"
            helm lint --strict deploy/helm/baluarte -f "$values"
            helm template ci deploy/helm/baluarte -f "$values" > /dev/null
            echo "::endgroup::"
          done
      - name: Rendering without a database must fail
        run: |
          if helm template ci deploy/helm/baluarte > /dev/null 2>&1; then
            echo "chart rendered without database configuration" >&2
            exit 1
          fi

  images:
    name: Build and scan ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: baluarte-app
            context: backend
          - image: baluarte-web
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "${{ matrix.image }}:ci" "${{ matrix.context }}"
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/compose/smoke-test.sh

  helm-smoke:
    name: Helm kind smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - run: deploy/helm/smoke-test.sh
