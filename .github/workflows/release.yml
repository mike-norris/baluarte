name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) publishes that commit:
# - baluarte-app, baluarte-web and baluarte-backup images for linux/amd64 and linux/arm64 to
#   ghcr.io/<owner>, each scanned with Trivy before it is pushed, with an SBOM and build
#   provenance attached, and signed with cosign (keyless, this workflow's identity);
# - the Helm chart as an OCI artifact at ghcr.io/<owner>/charts/baluarte, also signed;
# - a GitHub release with the CHANGELOG section for the version and the packaged chart.
# A tag with a pre-release suffix gets only its exact image tags and a pre-release on GitHub.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  check:
    name: Check the tag matches the versions in the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare the tag with pyproject.toml, package.json and Chart.yaml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          app=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml)
          web=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' frontend/package.json)
          chart=$(sed -n 's/^version: \(.*\)$/\1/p' deploy/helm/baluarte/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/helm/baluarte/Chart.yaml)
          for found in "$app" "$web" "$chart" "$app_version"; do
            if [ "$found" != "$base" ]; then
              echo "::error::tag $TAG does not match a version in the tree: $found (expected $base)"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=${base%.*}"
            if [ "$version" = "$base" ]; then echo "prerelease=false"; else echo "prerelease=true"; fi
          } >> "$GITHUB_OUTPUT"
      - name: The CHANGELOG has a section for the version
        env:
          BASE: ${{ steps.version.outputs.version }}
        run: |
          grep -q "^## \[${BASE%%-*}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${BASE%%-*}"
            exit 1
          }

  images:
    name: Publish ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: baluarte-app
            context: backend
          - image: baluarte-web
            context: frontend
          - image: baluarte-backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ needs.check.outputs.version }}
          MINOR: ${{ needs.check.outputs.minor }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            if [ "$PRERELEASE" = "false" ]; then echo "$IMAGE:$MINOR"; fi
            echo "EOF"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - name: Build for the scan (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MPL-2.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    name: Publish the Helm chart
    needs: [check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package, push and sign
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm lint --strict deploy/helm/baluarte -f deploy/helm/baluarte/ci/dev-database-values.yaml
          helm package deploy/helm/baluarte --version "$VERSION" --app-version "$VERSION" -d dist
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          pushed=$(helm push "dist/baluarte-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$pushed" | sed -n 's/^Digest: //p')
          echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "$REGISTRY/charts/baluarte@$digest"
          (cd dist && sha256sum "baluarte-$VERSION.tgz" > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/
          retention-days: 7

  release:
    name: Create the GitHub release
    needs: [check, images, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          base="${VERSION%%-*}"
          awk -v head="## [$base]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "Baluarte $TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*
