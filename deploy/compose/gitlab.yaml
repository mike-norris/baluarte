# Opt-in GitLab connection set by the deployment instead of the web UI. While this override is
# used, the Settings page shows the connection as managed by the deployment and read-only:
#
#   printf '%s' "$TOKEN" > secrets/gitlab_token     # read_api scope only
#   BALUARTE_GITLAB_URL=https://gitlab.example.internal \
#     docker compose -f compose.yaml -f deploy/compose/gitlab.yaml up -d
#
# For a private CA, also mount the bundle and set SSL_CERT_FILE on the api and worker services.
x-gitlab-env: &gitlab-env
  BALUARTE_GITLAB_URL: ${BALUARTE_GITLAB_URL:?set BALUARTE_GITLAB_URL}
  BALUARTE_GITLAB_TOKEN_FILE: /run/secrets/gitlab_token
  BALUARTE_GITLAB_TIMEOUT_SECONDS: ${BALUARTE_GITLAB_TIMEOUT_SECONDS:-15}
  BALUARTE_GITLAB_SYNC_INTERVAL_MINUTES: ${BALUARTE_GITLAB_SYNC_INTERVAL_MINUTES:-360}

services:
  # Diagnostics run in the API; capability detection and collection run in the worker.
  api:
    environment: *gitlab-env
    secrets: [postgres_password, secret_key, gitlab_token]
  worker:
    environment: *gitlab-env
    secrets: [postgres_password, secret_key, gitlab_token]

secrets:
  gitlab_token:
    file: ./secrets/gitlab_token
