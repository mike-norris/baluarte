# PostgreSQL client authentication for the TLS overlay (deploy/compose/tls.yaml).
#
# Over the network only TLS is accepted, and each client needs both a certificate from the
# local CA whose common name is the role it signs in as (clientcert=verify-full) and that role's
# password (scram-sha-256). Plain-text connections match no line and are refused.
# The local socket inside the container is used only by the image's own setup and health check.

# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256 clientcert=verify-full
