# The TLS server for the Compose TLS overlay (deploy/compose/tls.yaml), mounted in place of the
# image's plain default.conf. Certificates come from deploy/compose/make-tls-certs.sh locally,
# or from your own CA. Only TLS 1.2 and 1.3; plain HTTP is not served.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/nginx/tls/web.crt;
    ssl_certificate_key /etc/nginx/tls/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:baluarte_tls:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/locations.conf;
}

# The image's health check (plain http://127.0.0.1:8080/), on the container's own loopback only:
# it answers nothing else and is not reachable from outside the container.
server {
    listen 127.0.0.1:8080;
    server_tokens off;
    access_log off;

    location = / {
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
