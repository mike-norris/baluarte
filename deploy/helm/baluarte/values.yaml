# Default values for the Baluarte chart.
# Set either database.host (external PostgreSQL, recommended) or devDatabase.enabled.

global:
  # Prefix applied to both images, e.g. "registry.example.internal/baluarte". Empty uses the bare repository.
  imageRegistry: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

api:
  image:
    repository: baluarte-app
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Matches the UID baked into the image.
  runAsUser: 10001
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# Applies to the API, worker and migration Job. Secrets are redacted in both formats.
logging:
  # DEBUG, INFO, WARNING or ERROR.
  level: INFO
  # json (one object per line, for log collectors) or text.
  format: json

# Background job worker. Uses the api image and runAsUser; no Service.
worker:
  replicaCount: 1
  # Seconds between polls when the queue is empty.
  pollSeconds: 5
  # A job whose worker stops renewing its lease for this long is retried elsewhere.
  leaseSeconds: 300
  # Time to finish the current job after SIGTERM before the pod is killed.
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

web:
  image:
    repository: baluarte-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # nginx-unprivileged UID.
  runAsUser: 101
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# External PostgreSQL. The password is read from an existing Secret; the chart never stores it.
database:
  host: ""
  port: 5432
  name: baluarte
  user: baluarte
  # libpq sslmode: disable, allow, prefer, require, verify-ca or verify-full.
  sslMode: require
  existingSecret: ""
  passwordKey: password
  # The API and worker connect as this role, which the migration Job creates (or updates) and
  # grants data access only: it owns nothing, cannot change the schema and cannot alter audit
  # events. The owner above is used only by migrations. Set user to "" to connect as the owner
  # (not recommended). The migration user needs CREATEROLE, or create the role yourself.
  app:
    user: baluarte_app
    # Secret holding the app role's password. Not needed with devDatabase.enabled.
    existingSecret: ""
    passwordKey: password

# Runs baluarte-migrate as a Job for every install and upgrade. The API reports ready only
# once the schema is at the latest revision.
migrations:
  # Seconds to wait for the database to accept connections.
  waitTimeoutSeconds: 120
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# OIDC sign-in (authorization code flow with PKCE). With oidc.issuer empty, an administrator
# enters the identity provider in the web UI's setup wizard instead (unlocked by the setup code
# in the API log); until then sign-in and every protected endpoint answer 503.
auth:
  # Browser-facing https origin. Defaults to https://<ingress.host> when ingress.enabled.
  publicUrl: ""
  oidc:
    issuer: ""
    clientId: ""
    # Secret holding the client secret. Empty means a public client that relies on PKCE alone.
    existingSecret: ""
    clientSecretKey: client-secret
    scopes: "openid profile email"
    # ID token or userinfo claim listing the user's groups.
    rolesClaim: groups
    # Identity provider groups granted each role. Users in none of them cannot sign in.
    adminGroups: []
    analystGroups: []
    auditorGroups: []
    managerGroups: []
  # Session idle and absolute expiry in minutes. Empty (the default) leaves them to the operating
  # profile chosen in the web UI; a value here overrides it there.
  session:
    idleMinutes: null
    lifetimeMinutes: null

# The one self-managed GitLab instance to govern (ADR-0004). Access is read-only: create a
# token with the read_api scope only, ideally for a non-admin bot or auditor user. With url
# empty, an administrator can connect GitLab in the web UI instead.
gitlab:
  # https URL of the instance, e.g. https://gitlab.example.internal (no /api/v4).
  url: ""
  # Secret holding the token. Required when url is set.
  existingSecret: ""
  tokenKey: token
  # Per-request timeout, 1 to 120 seconds.
  timeoutSeconds: 15
  # How often the worker collects capabilities, groups and projects: 15 to 10080 minutes, or
  # 0 to collect only on request. Data older than twice this is reported as stale.
  syncIntervalMinutes: 360
  # Allow approved label plans to be applied to GitLab (docs/LABELS.md). The write token is
  # entered in the web UI, never here; while this is false no plan is applied.
  labelWrites: false

# Time tracking (docs/TIME_TRACKING.md). perPerson false hides time per person everywhere:
# only totals are shown.
timeTracking:
  perPerson: true

# Key that seals the GitLab token and OIDC client secret entered in the web UI (ADR-0008):
# 32 random bytes, base64-encoded. With existingSecret empty the chart generates one on install,
# keeps it across upgrades and leaves it behind on uninstall. Back it up with the database:
# without it, stored secrets cannot be read and must be entered again.
secretKey:
  existingSecret: ""
  key: secret-key

# Single-pod PostgreSQL for evaluation and CI only: no backups, no high availability.
# A random password is generated on install and kept across upgrades.
devDatabase:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  # postgres user in the Alpine image.
  runAsUser: 70
  storage:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Encrypted database backups (docs/OPERATIONS.md#scheduled-backups): a CronJob runs pg_dump as a
# read-only role, encrypts the stream with age for backup.recipient and keeps the newest
# backup.keep files on the PersistentVolumeClaim named by backup.existingClaim. Each run is
# recorded and checked by the Compliance page. Copy the volume's contents off the cluster;
# managed databases may also offer their own backups.
backup:
  enabled: false
  image:
    repository: baluarte-backup
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # age public key (age1...). Required when enabled; the private key stays offline.
  recipient: ""
  # Cron schedule in the controller's time zone. Daily keeps the backups control met.
  schedule: "17 2 * * *"
  keep: 14
  # The role the migration Job creates for backups (read-only, plus recording its runs).
  user: baluarte_backup
  # Secret holding its password. Not needed with devDatabase.enabled.
  existingSecret: ""
  passwordKey: password
  # PersistentVolumeClaim for the backup files, created by you, so that backups outlive the
  # release and its storage class need not bind before the first run. Required when enabled.
  existingClaim: ""
  # The postgres user in the image.
  runAsUser: 70
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []

# Exposes the web Service; the web pod proxies /api to the API Service.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: baluarte.example.internal
  # e.g. [{ secretName: baluarte-tls, hosts: [baluarte.example.internal] }]
  tls: []
