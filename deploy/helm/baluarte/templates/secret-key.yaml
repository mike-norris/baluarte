{{- if not .Values.secretKey.existingSecret }}
{{- $name := include "baluarte.secretKeyName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Seals secrets entered in the web UI. Generated once and kept across upgrades and uninstalls:
# without it, secrets stored in the database cannot be read.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "baluarte.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{ .Values.secretKey.key }}: {{ index $existing.data .Values.secretKey.key }}
  {{- else }}
  {{ .Values.secretKey.key }}: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
