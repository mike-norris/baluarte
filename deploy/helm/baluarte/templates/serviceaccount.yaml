{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "baluarte.serviceAccountName" . }}
  labels:
    {{- include "baluarte.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Baluarte does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
