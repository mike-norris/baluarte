# http-level settings shared by the plain (default.conf) and TLS servers.
# The scheme the browser used. Behind a TLS-terminating proxy (an Ingress, or a reverse proxy in
# front of Compose) this pod is reached over plain HTTP, so keep the proxy's X-Forwarded-Proto;
# without one, use this connection's scheme. The API marks setup cookies Secure from it.
map $http_x_forwarded_proto $baluarte_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HTTP Strict Transport Security only on responses the browser received over HTTPS.
map $baluarte_proto $baluarte_hsts {
    https   "max-age=31536000";
    default "";
}

# Sign-in and setup requests per client address. Behind a proxy every client shares the proxy's
# address, so the limit is generous: it stops floods, not people signing in.
limit_req_zone $binary_remote_addr zone=baluarte_auth:1m rate=5r/s;
# Webhook deliveries per sender address: GitHub sends bursts, so the limit only stops floods of
# unsigned requests, each of which the API checks against a stored secret.
limit_req_zone $binary_remote_addr zone=baluarte_webhooks:1m rate=20r/s;
limit_req_status 429;
