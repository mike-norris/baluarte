# Backend address for /api/. Docker Compose uses the "api" service; the Helm chart mounts its own copy.
# The name is resolved per request through Docker's embedded DNS, so a recreated api container
# (new IP) is picked up without restarting this one. A variable without a URI part passes the
# request URI through unchanged, as a literal proxy_pass would.
resolver 127.0.0.11 valid=10s ipv6=off;
set $baluarte_api http://api:8000;
proxy_pass $baluarte_api;
