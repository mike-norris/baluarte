# The site's locations, included by the plain (default.conf) and TLS servers.
root /usr/share/nginx/html;

location /api/ {
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/api-upstream.conf;
    include /etc/nginx/api-proxy-headers.conf;
}

location ~ ^/api/v1/(auth|setup)/ {
    limit_req zone=baluarte_auth burst=20 nodelay;
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/api-upstream.conf;
    include /etc/nginx/api-proxy-headers.conf;
}

# Signed deliveries (GitHub); the API refuses bodies over 5 MiB itself too.
location /api/v1/webhooks/ {
    client_max_body_size 5m;
    limit_req zone=baluarte_webhooks burst=100 nodelay;
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/api-upstream.conf;
    include /etc/nginx/api-proxy-headers.conf;
}

location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
